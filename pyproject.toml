[project]
name = "ai-buddy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["packages/buddy_core", "jobs/sync", "services/mcp_server", "services/chat_bot"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "firestore: needs the Firestore emulator (FIRESTORE_EMULATOR_HOST); run with ./run-unit-tests.sh --emulator",
    "pubsub: needs the Pub/Sub emulator (PUBSUB_EMULATOR_HOST); run with ./run-unit-tests.sh --emulator",
]

[tool.coverage.run]
source = ["buddy_core", "buddy_sync", "buddy_mcp", "buddy_bot"]
branch = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "packages/buddy_core:jobs/sync:services/mcp_server:services/chat_bot"
files = [
    "packages/buddy_core/buddy_core",
    "jobs/sync/buddy_sync",
    "services/mcp_server/buddy_mcp",
    "services/chat_bot/buddy_bot",
    "tests",
]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# snowballstemmer ships no stubs and no py.typed marker.
module = "snowballstemmer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-cloud-pubsub ships no py.typed marker; only buddy_bot.intake.pubsub and its test import it.
module = "google.cloud.pubsub_v1"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-cloud-storage ships no py.typed marker; only buddy_core.gcs_bucket and its test import it.
module = "google.cloud.storage"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# protobuf ships no stubs here; only buddy_bot.chat_api (FieldMask, json_format) and its test use it.
module = "google.protobuf"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/buddy_core", "jobs/sync", "services/mcp_server", "services/chat_bot", "tests"]
# Planning/research markdown embeds illustrative Python; ruff must not gate it.
extend-exclude = [".planning", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["buddy_core", "buddy_sync", "buddy_mcp", "buddy_bot"]
