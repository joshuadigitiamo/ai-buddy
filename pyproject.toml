[project]
name = "ai-buddy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["packages/buddy_core", "jobs/sync"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["buddy_core", "buddy_sync"]
branch = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "packages/buddy_core:jobs/sync"
files = ["packages/buddy_core/buddy_core", "jobs/sync/buddy_sync", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/buddy_core", "jobs/sync", "tests"]
# Planning/research markdown embeds illustrative Python; ruff must not gate it.
extend-exclude = [".planning", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["buddy_core", "buddy_sync"]
