# Laptop sync image (D-09): tested and built here, never pushed and never deployed.
#
# The sync job runs on the laptop (scripts/sync-and-publish.sh); CI only proves that the tests pass and
# that the image still builds from the current Dockerfile. There is no Cloud Run job, so there is no
# cloud access, no registry login and no token for this workflow.
name: sync

on:
  push:
    branches: [main]
    paths:
      - "jobs/sync/**"
      - "packages/buddy_core/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/sync.yml"
      - ".github/workflows/_test.yml"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the sync image without pushing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sync
          push: false
