# Meridian sidecar image (D-14): built only from the commit recorded in deploy/meridian.version.
#
# Meridian is a third-party proxy that holds a Claude Max login. Its source is never taken from a
# branch or a tag: a change to deploy/meridian.version (reviewed in a commit) is the only way a new
# build starts. The chat-bot deploy waits for the tag built here and fails when it never appears.
#
# The repository is public, so its Actions logs are public: the project identifiers are repository
# secrets, which GitHub masks everywhere, and the job fails, naming the missing one, when any is empty.
name: meridian

on:
  push:
    branches: [main]
    paths:
      - "deploy/meridian.version"
      - ".github/workflows/meridian.yml"
  workflow_dispatch:

permissions: {}

# Pushes never cancel one another: a second push builds after the first.
concurrency:
  group: deploy-meridian
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_DEPLOYER_SA: ${{ secrets.GCP_DEPLOYER_SA }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          # Names only: a value is never printed, not even a masked one.
          missing=0
          for name in GCP_PROJECT_ID GCP_PROJECT_NUMBER GCP_DEPLOYER_SA GCP_WIF_PROVIDER; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Read the approved Meridian commit
        id: version
        run: |
          sha="$(tr -d '[:space:]' < deploy/meridian.version)"
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy/meridian.version must hold a full 40-character commit"
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: europe-west8-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Meridian from the approved commit and push it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/rynfar/meridian.git#${{ steps.version.outputs.sha }}
          push: true
          tags: europe-west8-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ai-buddy/meridian:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=meridian
          cache-to: type=gha,scope=meridian,mode=max
