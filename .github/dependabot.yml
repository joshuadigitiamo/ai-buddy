# Weekly pull requests that move the SHA-pinned third-party actions to their newest release.
# The commit pin stays in place and the version comment next to it is updated with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Moves the python:3.12-slim digest in every FROM line of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
