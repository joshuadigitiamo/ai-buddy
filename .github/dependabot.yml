# Weekly pull requests that move the SHA-pinned third-party actions to their newest release.
# The commit pin stays in place and the version comment next to it is updated with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Moves the python:3.12-slim digest in every FROM line of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # A pip PR changes a plain requirements file only: before merging, run
  # scripts/lock-requirements.sh on the PR branch and commit the regenerated locks, or the lock
  # test fails on main. Nothing is merged automatically.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/mcp_server
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/chat_bot
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /jobs/sync
    schedule:
      interval: weekly
