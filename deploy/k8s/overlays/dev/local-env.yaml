# Wires the dev ConfigMaps into the workloads (strategic merge patch).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  template:
    spec:
      containers:
        - name: mcp-server
          envFrom:
            - configMapRef:
                name: mcp-server-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-bot
spec:
  template:
    spec:
      containers:
        - name: chat-bot
          envFrom:
            - configMapRef:
                name: chat-bot-local
