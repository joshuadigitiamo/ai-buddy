# Creates the topic and subscription through the Pub/Sub emulator REST API, as the compose
# pubsub-init service does: 200 (created) and 409 (already there) both mean ready. The script
# first waits for the emulator Service, so the Job does not burn its retries during start-up.
apiVersion: batch/v1
kind: Job
metadata:
  name: pubsub-init
  labels:
    app.kubernetes.io/name: pubsub-init
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubsub-init
        app.kubernetes.io/part-of: ai-buddy
        app.kubernetes.io/component: init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: pubsub-init
          image: google/cloud-sdk:592.0.0-emulators
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              base=http://pubsub-emulator:8085/v1/projects/demo-ai-buddy
              tries=0
              until curl -sf -o /dev/null http://pubsub-emulator:8085/; do
                tries=$((tries + 1))
                [ "$tries" -lt 60 ] || { echo "pubsub-init: emulator not reachable" >&2; exit 1; }
                sleep 2
              done
              put() {
                code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -d "$2" "$base/$1")
                case "$code" in 200|409) ;; *) echo "pubsub-init: $1 returned $code" >&2; exit 1 ;; esac
              }
              put topics/chat-events '{}'
              put subscriptions/chat-events '{"topic":"projects/demo-ai-buddy/topics/chat-events"}'
              echo "pubsub-init: topic and subscription ready"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
