# Firestore and Pub/Sub emulators (same image and commands as docker-compose.yml). Local use only:
# the image runs as root and keeps state in memory, so these Deployments are the recorded
# exception to the restricted Pod Security level (README). Readiness is a TCP check because the
# emulators have no dependency-free health route of their own beyond the port itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firestore-emulator
  labels:
    app.kubernetes.io/name: firestore-emulator
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firestore-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firestore-emulator
        app.kubernetes.io/part-of: ai-buddy
        app.kubernetes.io/component: emulator
    spec:
      automountServiceAccountToken: false
      containers:
        - name: firestore-emulator
          image: google/cloud-sdk:592.0.0-emulators
          imagePullPolicy: IfNotPresent
          command:
            - gcloud
            - emulators
            - firestore
            - start
            - --host-port=0.0.0.0:8080
          ports:
            - name: grpc
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: firestore-emulator
  labels:
    app.kubernetes.io/name: firestore-emulator
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: emulator
spec:
  selector:
    app.kubernetes.io/name: firestore-emulator
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-emulator
  labels:
    app.kubernetes.io/name: pubsub-emulator
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pubsub-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubsub-emulator
        app.kubernetes.io/part-of: ai-buddy
        app.kubernetes.io/component: emulator
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pubsub-emulator
          image: google/cloud-sdk:592.0.0-emulators
          imagePullPolicy: IfNotPresent
          command:
            - gcloud
            - beta
            - emulators
            - pubsub
            - start
            - --host-port=0.0.0.0:8085
            - --project=demo-ai-buddy
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            tcpSocket:
              port: 8085
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: pubsub-emulator
  labels:
    app.kubernetes.io/name: pubsub-emulator
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: emulator
spec:
  selector:
    app.kubernetes.io/name: pubsub-emulator
  ports:
    - name: http
      port: 8085
      targetPort: http
