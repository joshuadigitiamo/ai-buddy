# MCP server: one replica, restricted-style securityContext, probes on /healthz.
# The probes carry a Host header because the server's Host guard rejects the pod IP that
# Kubernetes would otherwise send (04-02); the overlay lists the same name in the server's
# allow-list. This base sets no local-only knob: on its own the server refuses to start
# (fail closed). Only an overlay supplies the deployment environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: ai-buddy
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp-server
          image: ai-buddy/mcp-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: mcp-server
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: mcp-server
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: ai-buddy
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8000
      targetPort: http
