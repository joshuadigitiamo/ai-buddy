# INFRA-02 stack: the whole system from the per-service images, with both emulators.
#
# The default services are hermetic: Firestore and Pub/Sub emulators, a stub LLM, the recording
# Chat adapter and the demo-ai-buddy project id. Nothing reaches the real Google Chat API,
# Joshua's Max session, a service-account key or a real GCP project.
#
#   HANDBOOK_SRC_DIR=... GUIDES_SRC_DIR=... REDACT_PAGE_FILES=... THREAD_KEY_SECRET=... \
#     docker compose up --build
#   scripts/compose-smoke.sh        # hermetic round trip over the repository fixtures
#
# Start order is fixed by depends_on conditions: firestore and pubsub healthy, then pubsub-init
# and the sync one-shot completed successfully, then mcp-server healthy, then chat-bot. A failed
# sync (for example an empty handbook folder) therefore keeps mcp-server and chat-bot down.
#
# The default services publish nothing; profile eval publishes only the MLflow UI, on
# 127.0.0.1:5000. Secrets come only by ${...} interpolation.
# The images run as uid 10001: a host directory mounted for writing must be writable by that
# uid, or the container must run with --user. Host read-only inputs must be world-readable.
#
# Host variables read by compose: HANDBOOK_SRC_DIR, GUIDES_SRC_DIR, REDACT_PAGE_FILES,
# THREAD_KEY_SECRET (at least 32 characters), GUIDES_BRANCH, GUIDES_WEB_BASE, VIDEO_THUMBNAIL_URL,
# and for the live profile MERIDIAN_API_KEY, BOT_SA_KEY_FILE, HOST_UID and HOST_GID.
#
# Profile `live` is Joshua's real Chat bot and Meridian (it replaces docker-compose.dev.yml):
#   docker compose --profile live up mcp-server meridian chat-bot-live
# with HANDBOOK_SRC_DIR and GUIDES_SRC_DIR pointing at the real snapshot and Guides checkout
# (run the sync service once first so the artifacts volume holds an index).
# - Meridian credentials live in the external named volume `meridian-claude` (03-01 decision,
#   04-01 token_chain (b)): seed it once as services/chat_bot/README.md describes. They are never
#   baked into an image and the host ~/.claude is never mounted. The compose Meridian stays
#   writable so it can refresh its own login.
# - Meridian is built only from the commit recorded in deploy/meridian.version.
#
# Profile `eval` is the evaluation job (05-06): a pinned, loopback-only MLflow server and the eval
# container, which runs the bot workflow in-process against the compose mcp-server:
#   docker compose --profile eval run --rm eval <command>
#   scripts/eval-smoke.sh           # hermetic run: stub LLM, real MLflow container, no Meridian
#   docker compose --profile eval run --rm eval empty-context   # D-16: needs eval-fixture and
#   mcp-server-empty, which the eval service starts (second server on the fixture index)
# Optional host variables: EVAL_LLM_BACKEND, EVAL_LLM_BASE_URL, EVAL_PRIVATE_DIR (default
# ./docs/internal, mounted at /private), EVAL_GOLDEN_PUBLIC_PATH, EVAL_GOLDEN_PRIVATE_PATH,
# JUDGE_MODEL, the Meridian Opus tier override, HOST_UID and HOST_GID. Nothing is deployed from this profile.
services:
  firestore:
    image: google/cloud-sdk:592.0.0-emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 2s
      timeout: 3s
      retries: 45

  pubsub:
    image: google/cloud-sdk:592.0.0-emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=demo-ai-buddy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/"]
      interval: 2s
      timeout: 3s
      retries: 45

  # Creates the topic and subscription through the emulator REST API; 200 and 409 both mean ready.
  pubsub-init:
    image: google/cloud-sdk:592.0.0-emulators
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -eu
        base=http://pubsub:8085/v1/projects/demo-ai-buddy
        put() {
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -d "$$2" "$$base/$$1")
          case "$$code" in 200|409) ;; *) echo "pubsub-init: $$1 returned $$code" >&2; exit 1 ;; esac
        }
        put topics/chat-events '{}'
        put subscriptions/chat-events '{"topic":"projects/demo-ai-buddy/topics/chat-events"}'
        echo "pubsub-init: topic and subscription ready"
    depends_on:
      pubsub:
        condition: service_healthy

  # One-shot: builds index.db from the read-only handbook snapshot and Guides checkout into the
  # artifacts volume (D-10: compose serves a local store). A non-zero exit keeps the stack down.
  sync:
    build:
      context: .
      target: sync
    restart: "no"
    environment:
      HANDBOOK_DIR: /handbook
      GUIDES_REPO_URL: /guides-src
      GUIDES_BRANCH: ${GUIDES_BRANCH:-master}
      GUIDES_CHECKOUT_DIR: /app/.cache/guides
      ARTIFACT_DIR: /artifacts
      REDACT_PAGE_FILES: ${REDACT_PAGE_FILES:?set REDACT_PAGE_FILES (comma-separated page files kept out of the index)}
    # Long syntax so a relative HANDBOOK_SRC_DIR or GUIDES_SRC_DIR is read as a path, never as a
    # named volume.
    volumes:
      - type: bind
        source: ${HANDBOOK_SRC_DIR:?set HANDBOOK_SRC_DIR (handbook snapshot folder)}
        target: /handbook
        read_only: true
      - type: bind
        source: ${GUIDES_SRC_DIR:?set GUIDES_SRC_DIR (Guides git checkout)}
        target: /guides-src
        read_only: true
      - artifacts:/artifacts

  mcp-server:
    build:
      context: .
      target: mcp_server
    # No env_file: the server receives only the variables listed here, never the bot's secrets
    # (THREAD_KEY_SECRET, MERIDIAN_API_KEY, ANTHROPIC_API_KEY).
    environment:
      DEPLOY_ENV: local
      AUTH_MODE: "off"
      ARTIFACT_STORE: local
      ARTIFACT_DIR: /artifacts
      # The Service name the bot calls; the Host guard admits it on plain http (04-02).
      MCP_ALLOWED_HOSTS: mcp-server
      MCP_HOST: 0.0.0.0
      PORT: "8000"
      GUIDES_WEB_BASE: ${GUIDES_WEB_BASE:-https://github.com/example-org/guides}
      GAP_TTL_DAYS: ${GAP_TTL_DAYS:-90}
      GAP_COLLECTION: ${GAP_COLLECTION:-gaps}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-30}
      FIRESTORE_EMULATOR_HOST: firestore:8080
      GOOGLE_CLOUD_PROJECT: demo-ai-buddy
    volumes:
      - artifacts:/artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30
    depends_on:
      sync:
        condition: service_completed_successfully
      firestore:
        condition: service_healthy

  # Anthropic Messages-compatible stub (deploy/compose/stub_llm.py): deterministic answers, so
  # the round trip needs neither a model nor a Max session. It runs from the chat_bot image.
  stub-llm:
    build:
      context: .
      target: chat_bot
    command: ["python", "/stub/stub_llm.py"]
    volumes:
      - ./deploy/compose:/stub:ro

  chat-bot:
    build:
      context: .
      target: chat_bot
    # No env_file and no credentials: this bot cannot reach a real service.
    environment:
      DEPLOY_ENV: local
      INTAKE: pubsub
      PUBSUB_SUBSCRIPTION: projects/demo-ai-buddy/subscriptions/chat-events
      PUBSUB_EMULATOR_HOST: pubsub:8085
      LLM_BACKEND: meridian
      LLM_BASE_URL: http://stub-llm:8090
      MCP_URL: http://mcp-server:8000/mcp
      MCP_AUTH: none
      CHAT_API: recording
      CHAT_RECORD_PATH: /tmp/chat.jsonl
      ALLOWED_USERS: users/111111111111111111111
      THREAD_KEY_SECRET: ${THREAD_KEY_SECRET:?set THREAD_KEY_SECRET (at least 32 characters)}
      VIDEO_THUMBNAIL_URL: ${VIDEO_THUMBNAIL_URL:-https://example.invalid/video-thumbnail.png}
      FIRESTORE_EMULATOR_HOST: firestore:8080
      GOOGLE_CLOUD_PROJECT: demo-ai-buddy
      LANGSMITH_TRACING: "false"
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
      # Also direct, so a failed sync stops the bot even if mcp-server's own gate is changed.
      sync:
        condition: service_completed_successfully
      mcp-server:
        condition: service_healthy
      stub-llm:
        condition: service_started
      firestore:
        condition: service_healthy

  # ---- profile live: Joshua's real Chat bot and Meridian (replaces docker-compose.dev.yml) ----

  # Built only from the commit in deploy/meridian.version (approved at 03-01; test_compose.py
  # asserts the SHA below equals that file).
  meridian:
    profiles: [live, eval]
    build:
      context: https://github.com/rynfar/meridian.git#cafdcf780f1b40c8f0dee17481132f47b4cbb353
    environment:
      MERIDIAN_HOST: 0.0.0.0
      MERIDIAN_PORT: "3456"
      MERIDIAN_HOST_ID: meridian-dev
      # Compose interpolates every service, even one in an inactive profile, so a required
      # (:?) variable here would break the default stack. chat-bot-live refuses to start
      # without the key instead (see its command).
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:-}
      # BOT-11: drops Meridian's routine per-request [PROXY] stderr lines (docs/configuration.md).
      # Meridian has no other option to reduce request logging; debug flags stay unset.
      MERIDIAN_SILENT: "1"
      # The Opus judge (eval profile) must not fall to the [1m] tier by default; the live bot
      # uses only Haiku and Sonnet, so the live profile is unaffected.
      MERIDIAN_OPUS_MODEL: ${MERIDIAN_OPUS_MODEL:-opus}
      # Meridian's own login: a one-year `claude setup-token` token from .env, passed as an
      # oauthToken profile (Meridian docs/deployment.md). Never seed from the host
      # ~/.claude/.credentials.json: its refresh token is shared with the host Claude Code CLI,
      # and whichever side refreshes first logs the other out (services/chat_bot/README.md).
      MERIDIAN_PROFILES: '[{"id":"local","oauthToken":"${MERIDIAN_OAUTH_TOKEN:-}"}]'
      MERIDIAN_DEFAULT_PROFILE: local
    # Comes back after a host restart; the token needs no reseeding.
    restart: unless-stopped
    volumes:
      # SDK session state only; the credentials come from the token above.
      - meridian-claude:/home/claude/.claude

  chat-bot-live:
    profiles: [live]
    build:
      context: .
      target: chat_bot
    # The image runs as uid 10001, which cannot read a key file kept at mode 600 by its owner.
    # Live use runs as the host user instead, so the key file needs no chmod.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Fail fast and loudly when the live inputs are missing: compose cannot require them here,
    # because the default stack (no profile) must load without them.
    command:
      - sh
      - -c
      - |
        [ -n "$$MERIDIAN_API_KEY" ] || { echo "chat-bot-live: MERIDIAN_API_KEY is not set (put it in .env)" >&2; exit 1; }
        [ -s /secrets/bot-sa.json ] || { echo "chat-bot-live: BOT_SA_KEY_FILE is not set or the key file is empty" >&2; exit 1; }
        exec python -m buddy_bot
    env_file:
      - path: .env
        required: true
    environment:
      HOME: /tmp
      # MCP_AUTH=none is accepted only with DEPLOY_ENV=local; local is refused under K_SERVICE.
      DEPLOY_ENV: local
      INTAKE: pubsub
      CHAT_API: google
      LLM_BACKEND: meridian
      LLM_BASE_URL: http://meridian:3456
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:-}
      # The Service name, admitted by the server's MCP_ALLOWED_HOSTS (same rule in kind).
      MCP_URL: http://mcp-server:8000/mcp
      MCP_AUTH: none
      # .env carries the MCP server's PORT=8000; the bot's own port is set here.
      PORT: "8080"
      FIRESTORE_EMULATOR_HOST: firestore:8080
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/bot-sa.json
      LANGSMITH_TRACING: "false"
    volumes:
      - ${BOT_SA_KEY_FILE:-/dev/null}:/secrets/bot-sa.json:ro
    depends_on:
      meridian:
        condition: service_started
      mcp-server:
        condition: service_healthy
      firestore:
        condition: service_healthy

  # ---- profile eval: the evaluation job and its local MLflow server (05-06, D-12, D-21) ----

  # The only published port of the stack, on loopback. The image is pinned by index digest and
  # runs as root (accepted: cap_drop ALL, no-new-privileges, no host mount, loopback port).
  # --allowed-hosts admits the Service name the eval container calls; the Host check would
  # answer 403 otherwise. The healthcheck uses an API route: /health is not served here.
  mlflow:
    profiles: [eval]
    image: ghcr.io/mlflow/mlflow:v3.18.0@sha256:257204c77980b0f3450a26eb6089e487603fcdd4509529eadaf88f90669f5c13
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "127.0.0.1:5000:5000"
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/2.0/mlflow/experiments/search?max_results=1', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30

  # Empty-context test (05-10, D-16): a second MCP server over an index built from the committed,
  # unrelated fixture sources. eval-fixture is the sole writer of the volume eval-empty; the
  # server and the eval container only read it. No env_file and no secrets reach either service.
  eval-fixture:
    profiles: [eval]
    build:
      context: .
      target: eval
    restart: "no"
    command: ["build-fixture", "--dest", "/eval-empty"]
    volumes:
      - eval-empty:/eval-empty

  # The same image and settings as mcp-server, on the fixture index and its own gap collection,
  # so the empty-context gaps never mix with the real ones. It publishes no port.
  mcp-server-empty:
    profiles: [eval]
    build:
      context: .
      target: mcp_server
    environment:
      DEPLOY_ENV: local
      AUTH_MODE: "off"
      ARTIFACT_STORE: local
      ARTIFACT_DIR: /artifacts
      MCP_ALLOWED_HOSTS: mcp-server-empty
      MCP_HOST: 0.0.0.0
      PORT: "8000"
      GUIDES_WEB_BASE: ${GUIDES_WEB_BASE:-https://github.com/example-org/guides}
      GAP_TTL_DAYS: ${GAP_TTL_DAYS:-90}
      GAP_COLLECTION: gaps_empty_context
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-30}
      FIRESTORE_EMULATOR_HOST: firestore:8080
      GOOGLE_CLOUD_PROJECT: demo-ai-buddy
    volumes:
      - eval-empty:/artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30
    depends_on:
      eval-fixture:
        condition: service_completed_successfully
      firestore:
        condition: service_healthy

  # Never deployed. Runs as the host user because it writes its cache and reports into the
  # host-owned private directory. Only the Meridian key arrives, by interpolation.
  eval:
    profiles: [eval]
    build:
      context: .
      target: eval
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      LLM_BACKEND: ${EVAL_LLM_BACKEND:-meridian}
      LLM_BASE_URL: ${EVAL_LLM_BASE_URL:-http://meridian:3456}
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-claude-opus-5-5}
      MCP_URL: http://mcp-server:8000/mcp
      MCP_EMPTY_URL: http://mcp-server-empty:8000/mcp
      ARTIFACT_DIR: /artifacts
      FIXTURE_DIR: /eval-empty
      EMPTY_GAP_COLLECTION: gaps_empty_context
      GOLDEN_PUBLIC_PATH: ${EVAL_GOLDEN_PUBLIC_PATH:-/app/jobs/eval/golden/guides.yaml}
      GOLDEN_PRIVATE_PATH: ${EVAL_GOLDEN_PRIVATE_PATH:-/private/golden-handbook.yaml}
      PRIVATE_DIR: /private
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_UI_BASE_URL: http://127.0.0.1:5000
      MLFLOW_DISABLE_TELEMETRY: "true"
      LANGSMITH_TRACING: "false"
      FIRESTORE_EMULATOR_HOST: firestore:8080
      GOOGLE_CLOUD_PROJECT: demo-ai-buddy
    volumes:
      - artifacts:/artifacts:ro
      - eval-empty:/eval-empty:ro
      # Long syntax so a relative path is read as a path, never as a named volume.
      - type: bind
        source: ${EVAL_PRIVATE_DIR:-./docs/internal}
        target: /private
    depends_on:
      mcp-server:
        condition: service_healthy
      mcp-server-empty:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      firestore:
        condition: service_healthy
      meridian:
        condition: service_started

volumes:
  artifacts:
  eval-empty:
  mlflow-data:
  meridian-claude:
    external: true
